packages:
  - "apps/*"
  - "packages/*"
shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true
allowBuilds:
  core-js: true
  ejs: true
  es5-ext: true
  esbuild: true
  fsevents: false
  ngx-infinite-scroll: set this to true or false
  # Its only install script prints a donation message (opencollective-postinstall).
  tesseract.js: false
  uglifyjs-webpack-plugin: set this to true or false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - zod@4.6.5
